name: Update stable release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stable-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Prepare matching stable update
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release.py
      - name: Validate package definitions
        if: steps.update.outputs.changed == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_INSTALL_FROM_API: '1'
        run: brew ruby scripts/validate_definitions.rb
      - name: Create or update upgrade PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/stable-release
          delete-branch: true
          commit-message: "chore(casks): update Fcitx5 and matching Rime stable release"
          title: Update Fcitx5 and matching Rime stable release
          body-path: ${{ runner.temp }}/fcitx5-upgrade-pr.md
          add-paths: |
            Casks/fcitx5-macos.rb
            Casks/fcitx5-macos-rime.rb
